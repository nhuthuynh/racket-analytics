# Nightly quality jobs (ST-024; sprint-01 §3.1; ADR 0026).
# * oracle:   differential check P9, 100,000 random sequences, production engine vs the
#             independent oracle in backend/tests/oracle (NFR-002b).
# * mutation: mutmut on sports/pickleball/rules (NFR-072). Sprint 1 records a baseline; the
#             >= 85% gate starts in Sprint 2. Since SRE-VERIFY04R3-03 (sprint-04 §8, retro C5) also
#             coaching/plan and coaching/weakness, each gated at >= 0.80 and from an empty
#             mutants/ (mutmut 3 keeps earlier results there). Sprint 5 adds
#             matches/scorebook/integrity.py (ST-076b) and dataset/rally_f1.py (ST-084b).
# * perf-r1:  R1 reads at 50 RPS per endpoint on a flags-on Compose stack (ST-074; NFR-010.1-.9;
#             G05-01): the goal-scorecard §4 G05-01 command, 3 runs, every run must pass. Not
#             PR-blocking at first (sprint-05 §8.4, judgment) and not needed by publish.
# * browser-matrix: the @critical journeys in chromium, webkit and android-chrome, 3 repeats each,
#             retries off (ST-079; NFR-024.1-.3; G05-04): the goal-scorecard §4 G05-04 command.
#             Not needed by publish.
# * publish:  writes both results with the run date into the current sprint's status.json on
#             the default branch. Only this job can write, and it never runs test code.
# Reports pass between jobs as job outputs (small JSON), so no artifact download is needed.
name: Nightly quality

on:
  schedule:
    - cron: "43 2 * * *" # 02:43 UTC, before the CI nightly at 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.8.17"
  MUTMUT_VERSION: "3.8.0"
  FORCE_COLOR: "0"
  NODE_VERSION: "22"
  COMPOSE: docker compose -f infra/compose.yaml --env-file infra/env.example

jobs:
  oracle:
    name: Differential oracle, 100,000 sequences (NFR-002b)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      report: ${{ steps.report.outputs.report }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Production engine vs oracle
        run: |
          mkdir -p ../reports
          uv run --no-sync python -m tests.oracle.differential --sequences 100000 \
            --json ../reports/oracle.json > ../reports/oracle.log 2>&1 || status=$?
          tail -n 60 ../reports/oracle.log
          exit "${status:-0}"
      - name: Report as job output
        id: report
        if: always()
        run: |
          if [ -f ../reports/oracle.json ]; then
            echo "report=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' ../reports/oracle.json)" >> "$GITHUB_OUTPUT"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-oracle
          path: reports/oracle.*
          if-no-files-found: warn

  mutation:
    name: Mutation score, rules and coaching (NFR-072)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      report: ${{ steps.report.outputs.report }}
      coaching_plan: ${{ steps.report.outputs.coaching_plan }}
      coaching_weakness: ${{ steps.report.outputs.coaching_weakness }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: mutmut run
        run: |
          uv run --no-sync --with "mutmut==${MUTMUT_VERSION}" python ../scripts/ci/mutation_score.py \
            --project . --target src/racket/sports/pickleball/rules \
            --tests tests/unit/sports \
            --ignore tests/unit/sports/pickleball/test_rules_static.py \
            --out ../reports/mutation.json
      # Sprint-04 §8: coaching mutation >= 0.80 (first gate). A red step above must not skip these.
      - name: mutmut run, coaching/plan >= 0.80 (sprint-04 §8)
        if: success() || failure()
        run: |
          rm -rf mutants
          uv run --no-sync --with "mutmut==${MUTMUT_VERSION}" python ../scripts/ci/mutation_score.py \
            --project . --target src/racket/coaching/plan --tests tests/unit/coaching \
            --min-score 0.80 --out ../reports/mutation-coaching-plan.json
      - name: mutmut run, coaching/weakness >= 0.80 (sprint-04 §8)
        if: success() || failure()
        run: |
          rm -rf mutants
          uv run --no-sync --with "mutmut==${MUTMUT_VERSION}" python ../scripts/ci/mutation_score.py \
            --project . --target src/racket/coaching/weakness --tests tests/unit/coaching \
            --min-score 0.80 --out ../reports/mutation-coaching-weakness.json
      # Sprint-05 §8 (ST-076b): the corrections fingerprint (NFR-045.3), one module, >= 0.80.
      - name: mutmut run, matches/scorebook/integrity >= 0.80 (sprint-05 §8)
        if: success() || failure()
        run: |
          rm -rf mutants
          uv run --no-sync --with "mutmut==${MUTMUT_VERSION}" python ../scripts/ci/mutation_score.py \
            --project . --target src/racket/matches/scorebook/integrity.py \
            --tests tests/unit/matches/test_corrections_integrity.py \
            --min-score 0.80 --out ../reports/mutation-matches-integrity.json
      # Sprint-05 §8 (ST-084b): the rally-segmentation F1 matcher (NFR-006.1-.4), one module, >= 0.80.
      - name: mutmut run, dataset/rally_f1 >= 0.80 (sprint-05 §8)
        if: success() || failure()
        run: |
          rm -rf mutants
          uv run --no-sync --with "mutmut==${MUTMUT_VERSION}" python ../scripts/ci/mutation_score.py \
            --project . --target src/racket/dataset/rally_f1.py \
            --tests tests/unit/dataset/test_rally_f1.py \
            --min-score 0.80 --out ../reports/mutation-dataset-rally-f1.json
      - name: Report as job output
        id: report
        if: always()
        run: |
          for pair in report:mutation coaching_plan:mutation-coaching-plan coaching_weakness:mutation-coaching-weakness; do
            file="../reports/${pair#*:}.json"
            if [ -f "$file" ]; then
              echo "${pair%%:*}=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$file")" >> "$GITHUB_OUTPUT"
            fi
          done
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-mutation
          path: reports/mutation*.json
          if-no-files-found: warn

  perf-r1:
    name: R1 reads at 50 RPS per endpoint, flags on (NFR-010; G05-01)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # goal-scorecard §4 G05-01: all four flags on; shell values override infra/.env
      COMPOSE_PROJECT_NAME: racket-goal05-on
      FEATURE_AGE_GATE: "true"
      FEATURE_RETENTION_SETTING: "true"
      FEATURE_TRAINING_CONSENT: "true"
      FEATURE_QUOTAS: "true"
      # 50 fresh accounts per run, 3 runs, one client IP (as perf-baseline raises the auth limits)
      AUTH_LINK_LIMIT_PER_IP: "1000"
      AUTH_EXCHANGE_LIMIT_PER_IP: "1000"
      MATCH_CREATIONS_PER_IP_PER_HOUR: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - name: Start the stack (make up; each Locust user seeds its own account)
        run: |
          make up
      - name: Locust and verdict, 3 runs of 8 min (seeding and 1 min warm-up excluded, >= 5 min window)
        run: |
          mkdir -p reports/perf
          for run in 1 2 3; do
            uvx --from locust==2.46.7 locust -f backend/tests/perf/locustfile_r1.py --headless \
              -u 50 -r 50 -t 8m --csv reports/perf/r1-$run --only-summary || echo "locust rc=$?"
            python3 scripts/ci/perf_verdict.py --stats reports/perf/r1-${run}_stats.csv --rps 50 \
              --min-rps 49.5 --warmup-s 60 --p95-ms 300 --p99-ms 800 --max-error-pct 0.5 --min-window 300 \
              --per-endpoint match,score-sheet,dashboard,plan --json reports/perf/r1-$run.json \
              --summary "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "${status:-0}"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-perf-r1
          path: reports/perf/
          if-no-files-found: warn

  browser-matrix:
    name: Browser matrix, @critical journeys x 3 projects x 3 repeats (NFR-024; G05-04)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start the full stack (per-IP sign-in limits raised, as in the CI e2e job)
        env:
          AUTH_LINK_LIMIT_PER_IP: "1000"
          AUTH_EXCHANGE_LIMIT_PER_IP: "1000"
        run: $COMPOSE up -d --build --wait
      - name: Trust the dev CA (public root certificate only; ADR 0029)
        run: |
          $COMPOSE cp web-tls:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/racket-dev-ca.crt"
          sudo cp "$RUNNER_TEMP/racket-dev-ca.crt" /usr/local/share/ca-certificates/racket-dev-ca.crt
          sudo update-ca-certificates
      - name: Install ffmpeg (the rally-video specs build a decodable VP9 stand-in; W-01)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      # chromium and android-chrome launch the runner image's Google Chrome (CI=true,
      # e2e/helpers/browser-channel.ts); only WebKit (and the bundled Chromium) are downloaded.
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit
      - name: The goal-scorecard §4 G05-04 command
        shell: bash # -o pipefail: the method's rc survives the tee
        env:
          BASE_URL: https://localhost:3000
        run: |
          mkdir -p reports
          (cd web && for p in chromium webkit android-chrome; do
            PW_PROJECTS=$p npx playwright test --repeat-each 3 --grep @critical --output ../reports/pw-$p \
              --reporter json > ../reports/pw-$p.json || echo "playwright $p rc=$?"; done)
          python3 scripts/measure/browser_matrix.py reports/pw-*.json --require chromium,webkit,android-chrome \
            --json reports/browser-matrix.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-browser-matrix
          path: reports/
          if-no-files-found: warn

  publish:
    name: Publish results to the sprint status file
    needs: [oracle, mutation]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the nightly key into docs/sprints/<current>/status.json
        env:
          ORACLE_REPORT: ${{ needs.oracle.outputs.report }}
          MUTATION_REPORT: ${{ needs.mutation.outputs.report }}
          COACHING_PLAN_REPORT: ${{ needs.mutation.outputs.coaching_plan }}
          COACHING_WEAKNESS_REPORT: ${{ needs.mutation.outputs.coaching_weakness }}
          ORACLE_JOB: ${{ needs.oracle.result }}
          MUTATION_JOB: ${{ needs.mutation.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p reports
          [ -n "$ORACLE_REPORT" ] && printf '%s' "$ORACLE_REPORT" > reports/oracle.json
          [ -n "$MUTATION_REPORT" ] && printf '%s' "$MUTATION_REPORT" > reports/mutation.json
          [ -n "$COACHING_PLAN_REPORT" ] && printf '%s' "$COACHING_PLAN_REPORT" > reports/mutation-coaching-plan.json
          [ -n "$COACHING_WEAKNESS_REPORT" ] && printf '%s' "$COACHING_WEAKNESS_REPORT" > reports/mutation-coaching-weakness.json
          python3 scripts/ci/nightly_status.py --status auto \
            --oracle reports/oracle.json --mutation reports/mutation.json \
            --mutation-scope coaching/plan=reports/mutation-coaching-plan.json \
            --mutation-scope coaching/weakness=reports/mutation-coaching-weakness.json \
            --oracle-job "$ORACLE_JOB" --mutation-job "$MUTATION_JOB" \
            --run-url "$RUN_URL" --sha "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the status file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sprints/*/status.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(nightly): quality results $(date -u +%F) [skip ci]"
          for _ in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
