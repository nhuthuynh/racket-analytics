# CI-OBJSTORE-STALL experiment (temporary; removed before the PR merges). Which path from the
# runner to the Compose object store stalls single connections: docker-proxy (the userland proxy
# on the published 127.0.0.1 port), the container's bridge IP, or kernel DNAT with the userland
# proxy off. Same runner, same store, alternating order.
name: objstore-stall-experiment

on:
  pull_request:
    paths:
      - ".github/workflows/objstore-stall-experiment.yml"
      - "scripts/ci/experiments/**"

permissions:
  contents: read

concurrency:
  group: objstore-stall-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f infra/compose.yaml --env-file infra/env.example
  ITERATIONS: "15"

jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install "uv==0.8.17"
      - working-directory: backend
        run: uv sync --locked
      - name: Runner facts
        run: |
          uname -a; docker version --format '{{.Server.Version}}'; docker info --format '{{json .}}' | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k: d.get(k) for k in ("ServerVersion","KernelVersion","CgroupDriver")})'
          cat /etc/docker/daemon.json || true
          sysctl net.ipv4.tcp_congestion_control net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.core.default_qdisc
          ip link show | grep -E 'mtu' | head
      - name: Sample the store sockets every 0.5 s
        run: |
          mkdir -p reports
          nohup bash -c 'while :; do echo "# t=$(date +%s.%N)"; ss -tinmo state established "( sport = :8333 or dport = :8333 )"; sleep 0.5; done' >reports/ss.txt 2>&1 &
      - name: Phase 1 - docker-proxy vs the container IP (userland proxy on, the CI default)
        run: scripts/ci/experiments/objstore_stall_loop.sh reports/phase1.jsonl "$ITERATIONS" proxy direct
      - name: Phase 1 report
        if: always()
        run: python3 scripts/ci/experiments/objstore_stall_report.py reports/phase1.jsonl reports/ss.txt
      - name: Phase 2 - userland proxy off, the same 127.0.0.1 port through kernel DNAT
        run: |
          cfg=$( (cat /etc/docker/daemon.json 2>/dev/null || echo '{}') | jq '. + {"userland-proxy": false}')
          echo "$cfg" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.ServerVersion}}'
          scripts/ci/experiments/objstore_stall_loop.sh reports/phase2.jsonl "$ITERATIONS" dnat direct
      - name: Phase 2 report
        if: always()
        run: |
          python3 scripts/ci/experiments/objstore_stall_report.py reports/phase2.jsonl reports/ss.txt
          pkill -f 'ss -tinmo' || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: objstore-stall-${{ matrix.shard }}
          path: reports/
