# Fresh-context PR review bot (working-agreement §7 step 7; DPA/AI-11, DPA/AI-13).
# Requires the repository secret ANTHROPIC_API_KEY (docs/process/ci-cd.md). Without it the
# job logs a notice and does nothing, so forks and new clones stay green.
# Guards: least-privilege token, no bots or forks, drafts skipped, --max-turns, job timeout,
# one run per PR (concurrency). Comments are posted with GITHUB_TOKEN, and events created by
# GITHUB_TOKEN never trigger new workflow runs, so the bot cannot loop on its own comments.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Check that ANTHROPIC_API_KEY is configured
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::Set the ANTHROPIC_API_KEY repository secret to enable it (docs/process/ci-cd.md)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a fresh-context reviewer for racket-analytics. Review only this PR's diff
            (`gh pr diff`). The standards are in docs/process/definition-of-done.md,
            docs/process/working-agreement.md §6-§7, docs/process/testing-strategy.md and
            docs/process/ddd-guidelines.md. Read only what the diff needs.

            Flag only gaps that affect correctness, security or the stated requirements
            (sprint docs, Gherkin in tests/features, NFRs). Do not ask for speculative
            refactors. Label every finding Blocking, Nit or Optional.

            Always check:
            - tests were added first and negative cases exist; no accepted test, scenario or
              gold file was edited or deleted (EP/ENG-28);
            - every route that takes a resource ID has a BOLA test (AQS/SEC-09);
            - error bodies leak no internals; logs carry no personal data or signed URLs;
            - configuration comes only from the environment; no secrets in the diff;
            - domain modules import no framework code (ddd-guidelines).

            Post inline comments for line-specific findings and one summary comment with a
            verdict: "No Blocking findings" or the list of Blocking findings.
          claude_args: |
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
