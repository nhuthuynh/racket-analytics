# CI and merge gates (ST-002; sprint-00 §3.1, §8; working-agreement §7.1).
# Every gate fails closed: a missing project, lockfile or report is a red gate, never a skip.
# Branch protection requires the single `ci-gate` check (docs/process/ci-cd.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: E2E streak (sprint-00 §8) and flaky-test report (NFR-074)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  UV_VERSION: "0.8.17"
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
  # NFR-073 time budgets (seconds). Domain suite = unit tests under DOMAIN_TEST_PATHS.
  DOMAIN_UNIT_BUDGET_S: "10"
  BACKEND_UNIT_BUDGET_S: "60"
  INTEGRATION_BUDGET_S: "600"
  # Property tests on the Hypothesis `ci` profile (>= 1,000 examples, ST-004). Own budget, so
  # the 10 s domain budget keeps measuring the default profile (QA-R1-07; decision-log).
  PROPERTY_BUDGET_S: "90"
  # NFR-073 "rules + domain unit suite": the rules engine and the bounded contexts' unit tests.
  # tests/unit as a whole is the backend unit suite with its own 60 s budget (W-01, run 37434214390).
  DOMAIN_TEST_PATHS: "tests/unit/sports tests/unit/matches tests/unit/players tests/unit/video_ingest tests/unit/analytics"
  COMPOSE: docker compose -f infra/compose.yaml --env-file infra/env.example
  FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------------ PR policy gates
  pr-policy:
    name: PR policy (test immutability, size)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Diff from the merge base of HEAD (the merge ref) and the current base branch, never from
      # pull_request.base.sha: that SHA is frozen at the event, and a merge ref rebuilt on a newer
      # main would blame main's changes on the PR (CI-POLICY-BASE, CI run 37739461709).
      - name: Test and gold immutability (EP/ENG-28, NFR-078)
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/check_test_immutability.py --base "origin/$BASE_REF" --head HEAD
      - name: PR size (EP/ENG-04)
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/check_pr_size.py --base "origin/$BASE_REF" --head HEAD

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "actionlint-py==1.7.12.25" "shellcheck-py==0.11.0.1"
      - run: actionlint -color

  # ------------------------------------------------------------------ backend static checks
  python-lint:
    name: Python lint and format (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  python-types:
    name: Python types (mypy; strict on domain modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run mypy

  python-unit:
    name: Python unit suites (time-budgeted)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      # Unbudgeted: compile bytecode for deps, src and rewritten tests, so the budgets below
      # measure test time, not a cold cache (run 37298471332: 11.1 s cold vs 6.8 s warm).
      - name: Warm the bytecode cache (collect only, not budgeted)
        run: uv run --no-sync pytest -q --collect-only -m unit
      # PE-R1-DB-01 (ADR 0049): a fresh checkout has no .hypothesis/constants, so each worker's
      # first example parsed every local module (~1.3 s per worker). Collects the domain
      # selection and draws one example; runs no test.
      - name: Warm the Hypothesis constants cache (not budgeted)
        run: |
          # shellcheck disable=SC2086 # DOMAIN_TEST_PATHS is a space-separated list
          uv run --no-sync python ../scripts/ci/warm_hypothesis_constants.py -m "unit and not red_until" $DOMAIN_TEST_PATHS
      # CI-DOMAIN-BUDGET (ADR 0049): runs 37882972340 and 37918385248 hit 10 s with every test
      # passing; ~80% of the suite is Hypothesis generation on the default profile in one process.
      # Parallel workers (one per core, work stealing); same budget, selection and profile, and the
      # budget still times start-up and collection. The wall time is kept as evidence.
      - name: Domain unit suite < 10 s (NFR-073)
        run: |
          # shellcheck disable=SC2086 # DOMAIN_TEST_PATHS is a space-separated list
          python3 ../scripts/ci/run_with_budget.py "$DOMAIN_UNIT_BUDGET_S" --json ../reports/budget/domain-unit.json -- uv run --no-sync pytest -q -n auto --dist worksteal -m "unit and not red_until" $DOMAIN_TEST_PATHS
      - name: Property tests, Hypothesis ci profile (>= 1,000 examples, ST-004)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          # shellcheck disable=SC2086 # DOMAIN_TEST_PATHS is a space-separated list
          python3 ../scripts/ci/run_with_budget.py "$PROPERTY_BUDGET_S" -- uv run --no-sync pytest -q -m "unit and not red_until" $DOMAIN_TEST_PATHS
      - name: Backend unit suite <= 60 s (NFR-073)
        run: python3 ../scripts/ci/run_with_budget.py "$BACKEND_UNIT_BUDGET_S" -- uv run --no-sync pytest -q -m "unit and not red_until" --junitxml=../reports/unit.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit
          path: |
            reports/unit.xml
            reports/budget/domain-unit.json
          if-no-files-found: warn

  drill-lint:
    # ST-053 (c), G03-09 (c): every drill in content/drills passes the FR-140 rules (QD-DR-01/02).
    # PE-R1-ST053-01: also against the base branch's library.lock, so a PR cannot delete or edit
    # a locked drill version by changing the lock in the same PR.
    name: Drill library lint (FR-140, ST-053)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base branch drill lock (an unknown base commit fails; no lock there = empty lock)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RACKET_DRILL_BASE_LOCK: ${{ runner.temp }}/base-library.lock
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          if git cat-file -e "${BASE_SHA}:content/drills/library.lock" 2>/dev/null; then
            git show "${BASE_SHA}:content/drills/library.lock" > "$RACKET_DRILL_BASE_LOCK"
          else
            echo '{"schema": "drill-library-lock/v1", "drills": {}}' > "$RACKET_DRILL_BASE_LOCK"
          fi
          echo "base lock of ${BASE_SHA}:"
          cat "$RACKET_DRILL_BASE_LOCK"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run --no-sync racket-drill-lint ../content/drills
        env:
          RACKET_DRILL_BASE_LOCK: ${{ runner.temp }}/base-library.lock

  # ------------------------------------------------------------------ integration on Compose
  integration:
    name: Integration, scenario and regression suites on Compose (+ changed-lines coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}" "diff-cover==10.6.0"
      - name: Install ffprobe (probe stage and probe tests need the real binary)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - name: Start backing services (same as production; never SQLite, AQS/OPS-05)
        # `up --wait` fails on a one-shot that exits (even 0), so the bucket init runs after.
        run: |
          $COMPOSE up -d --wait postgres objectstore mailpit tracing
          $COMPOSE run --rm objectstore-init
      - name: Export service endpoints
        run: |
          set -a; . infra/env.example; set +a
          {
            echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT}/${POSTGRES_DB}"
            echo "S3_ENDPOINT_URL=http://127.0.0.1:${S3_HOST_PORT}"
            echo "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}"
            echo "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}"
            echo "S3_REGION=${S3_REGION}"
            echo "S3_BUCKET_MEDIA=${S3_BUCKET_MEDIA}"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=${MAILPIT_SMTP_HOST_PORT}"
            echo "MAIL_SMTP_URL=smtp://127.0.0.1:${MAILPIT_SMTP_HOST_PORT}"
            echo "MAILPIT_API_URL=http://127.0.0.1:${MAILPIT_UI_HOST_PORT}"
            echo "APP_ENV=test"
          } >> "$GITHUB_ENV"
      - name: Object store parity IT-00-16 (ADR 0008 part C)
        working-directory: infra
        run: uv sync --locked && uv run pytest -q tests/test_object_store_parity.py
      - name: Warm the bytecode cache (unbudgeted; the budget times the suite, not setup)
        # As in python-unit (CI run 37298471332): cold compilation of the dependencies and the
        # rewritten test modules is runner setup, not the integration suite. CI-PERF-GATES.
        working-directory: backend
        run: |
          uv sync --locked
          uv run --no-sync pytest -q --collect-only -p no:cacheprovider \
            -m "(unit or integration or scenario or regression) and not nightly and not red_until" \
            --ignore=tests/integration/test_it_00_10_worker_sandbox.py \
            --ignore=tests/integration/test_it_00_10_worker_sandbox_strict.py >/dev/null
      - name: Migrate the base database before the parallel workers (unbudgeted setup)
        # Workers migrate their own session databases of this one cluster at the same moment.
        # Cluster-wide objects (migration 0012's role racket_media_worker) are created here
        # first, as Compose's `migrate` service does, so they cannot collide. ADR 0048.
        working-directory: backend
        run: uv run --no-sync python -m racket.platform.migrate
      - name: Backend suites with coverage (< 10 min, NFR-073)
        # pytest-xdist: one worker per runner core, each on its own session database (C-32).
        # The suite grew (IT-02-10 + IT-03-12 fuzz = 52% of 728 s serial); the 600 s budget
        # does not change. The budget record and the 25 slowest tests are kept per run.
        working-directory: backend
        run: |
          python3 ../scripts/ci/run_with_budget.py "$INTEGRATION_BUDGET_S" --json ../reports/integration-budget.json -- \
            uv run --no-sync pytest -q -n auto --durations=25 \
              -m "(unit or integration or scenario or regression) and not nightly and not red_until" \
              --ignore=tests/integration/test_it_00_10_worker_sandbox.py \
              --ignore=tests/integration/test_it_00_10_worker_sandbox_strict.py \
              --cov --cov-report=xml:../reports/coverage-backend.xml --junitxml=../reports/integration.xml
      - name: Rows waiting on a story (red_until; listed, not gated; a stale marker fails)
        # sprint-02 §8: rows red until a story (stretch or PO-blocked) are listed separately.
        # pytest's own rc is expected to be 1 here; the report decides (W-01).
        # CI-REDUNTIL-HANG (run 37961668800, TCR 2026-10-09): a row fails for its story in
        # seconds; a row that waits (a store at ~64 KiB/s) is stopped at 30 s and the run at
        # 90 s, and the report fails on a timed-out row or on fewer rows than were collected.
        working-directory: backend
        timeout-minutes: 4
        run: |
          rows=$(uv run --no-sync pytest -q -p no:cacheprovider --collect-only -m "red_until and not nightly" | grep -c '::' || true)
          uv run --no-sync pytest -q -p no:cacheprovider -m "red_until and not nightly" \
            -o timeout=30 --session-timeout=90 \
            --junitxml=../reports/red-until.xml || echo "pytest rc=$? (red-until rows are expected to fail)"
          python3 ../scripts/ci/red_until_report.py --junit ../reports/red-until.xml --root . \
            --expected-rows "$rows" --summary "$GITHUB_STEP_SUMMARY"
      - name: Changed-lines coverage >= 85% (testing-strategy §8, NFR-071)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: diff-cover reports/coverage-backend.xml --compare-branch="$BASE_SHA" --fail-under=85 --markdown-report reports/diff-cover-backend.md
      - name: Service logs on failure or cancel
        # CI-REDUNTIL-HANG: run 37961668800 was cancelled, so no store log was kept; the whole
        # object store log goes into the uploaded reports (the store's slow writes are unexplained).
        if: failure() || cancelled()
        run: |
          $COMPOSE logs --no-color --tail=200
          $COMPOSE logs --no-color objectstore > reports/objectstore.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: warn

  fixture-integrity:
    name: Fixture and gold-set integrity (FR-151, NFR-078)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bash scripts/ci/check_fixtures.sh "$BASE_SHA"

  infra-tests:
    name: Infra, hooks and CI-script tests (ST-001..ST-003)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # test_gitleaks_ignore.py checks each fingerprint's commit exists
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}" "shellcheck-py==0.11.0.1"
      - run: uv sync --locked
      # The runner image ships PostgreSQL 16 server binaries; dev-postgres.sh uses them.
      - run: uv run pytest -q -m "unit or integration"

  # ------------------------------------------------------------------ web
  web-checks:
    name: Web lint, types, unit, coverage, bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint --max-warnings=0 .
      - run: pnpm exec tsc --noEmit
      - name: Vitest with coverage (Cobertura for diff-cover)
        run: pnpm exec vitest run --coverage --coverage.reporter=cobertura --coverage.reporter=text-summary --coverage.reportsDirectory=../reports/web-coverage
      - name: Changed-lines coverage >= 80% (testing-strategy §8)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pip install "diff-cover==10.6.0"
          diff-cover reports/web-coverage/cobertura-coverage.xml --compare-branch="$BASE_SHA" --fail-under=80
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: First-route JS <= 200 KB gzipped (NFR-015)
        run: python3 ../scripts/ci/check_first_route_js.py --next-dir .next --route /page --budget-kb 200

  e2e:
    name: E2E (Playwright, Chromium + WebKit) with axe-core
    runs-on: ubuntu-24.04
    # 45: the gated step takes ~15 min and the listed red-until step runs failing tests to their
    # own timeouts (ST-054, run 37867886176 was cancelled at 30 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Start the full stack
        # Every Playwright test signs in from this one runner IP, so the per-IP sign-in limits
        # are raised here only; the per-email limit keeps its default (sign-in.spec.ts "Too many
        # link requests"). The per-IP limit itself is tested at API level (IT-01-02).
        env:
          AUTH_LINK_LIMIT_PER_IP: "1000"
          AUTH_EXCHANGE_LIMIT_PER_IP: "1000"
        run: $COMPOSE up -d --build --wait
      - name: Trust the dev CA (public root certificate only; ADR 0029)
        # web-tls (Caddy `tls internal`) generated its CA inside the container. Only the public
        # root certificate leaves it, so WebKit and service workers see a valid chain on this
        # throwaway runner; the CA key never leaves the caddy-data volume.
        run: |
          $COMPOSE cp web-tls:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/racket-dev-ca.crt"
          sudo cp "$RUNNER_TEMP/racket-dev-ca.crt" /usr/local/share/ca-certificates/racket-dev-ca.crt
          sudo update-ca-certificates
          curl --fail --silent --show-error -o /dev/null https://localhost:3000/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Worker sandbox IT-00-10 against the running worker container (NFR-054)
        working-directory: backend
        env:
          # The test calls `docker compose -f ../infra/compose.yaml`; this gives it the env file.
          COMPOSE_ENV_FILES: ${{ github.workspace }}/infra/env.example
        run: |
          pip install "uv==${UV_VERSION}"
          uv sync --locked
          uv run --no-sync pytest -q tests/integration/test_it_00_10_worker_sandbox.py \
            tests/integration/test_it_00_10_worker_sandbox_strict.py
      - name: Install ffmpeg (the rally-video specs build a decodable VP9 stand-in; W-01)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit
      - name: Playwright journeys; axe 0 serious/critical (NFR-027)
        # Gated: every spec except the red-first ones tagged @red-until-<story> (ADR 0046).
        working-directory: web
        env:
          # web-tls (ADR 0029): Secure `__Host-` cookies need https in WebKit.
          BASE_URL: https://localhost:3000
        run: pnpm exec playwright test --grep-invert "@red-until-" --reporter=github,html
      - name: E2E tests waiting on a story (@red-until-<story>; listed, not gated)
        # Playwright's own rc is expected to be 1 here; the report decides (ADR 0046).
        # 2 workers: these tests mostly wait out their timeouts while red (ST-054); the gated
        # step above keeps CI's single worker.
        # BASE_URL: playwright.config.ts defaults to https://localhost:3000, the same origin.
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../reports/e2e-red-until.json
        run: |
          pnpm exec playwright test --grep "@red-until-" --workers=2 --reporter=json \
            || echo "playwright rc=$? (red-until tests are expected to fail)"
      - name: Stale-tag check for the red-until E2E tests
        run: |
          python3 scripts/ci/e2e_red_until_report.py --json reports/e2e-red-until.json --specs web/e2e \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=300
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: warn

  perf-baseline:
    # ST-039 slice 3: Locust at 50 RPS on the API port, seeded through the https origin.
    # Gated now: availability >= 99.5% (NFR-041), correction/undo p95 <= 1.5 s (NFR-013),
    # sheet restored byte-identical (C-04). Read p95 is a baseline until the R1 review (NFR-010).
    name: Locust baseline 50 RPS (ST-039; NFR-010 baseline, NFR-013, NFR-041)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start the full stack
        # One account signs in for the whole run; the per-IP limits are raised as in e2e.
        env:
          AUTH_LINK_LIMIT_PER_IP: "1000"
          AUTH_EXCHANGE_LIMIT_PER_IP: "1000"
        run: $COMPOSE up -d --build --wait
      - name: Copy the dev CA root (public certificate only; ADR 0029)
        run: |
          mkdir -p reports/perf
          $COMPOSE cp web-tls:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/racket-dev-ca.crt"
      - name: Locust, 50 readers at 1 RPS and 1 correction user, >= 60 s steady window
        env:
          RA_ORIGIN: https://localhost:3000
          RA_CACERT: ${{ runner.temp }}/racket-dev-ca.crt
          MAILPIT_API_URL: http://127.0.0.1:8025
          RA_PERF_STATE: reports/perf/perf_state.json
        run: |
          pip install "uv==${UV_VERSION}"
          # Locust exits 1 on any failed request; perf_verdict.py decides the gate.
          # -t counts seeding (test_start) and spawn too: 90 s = a 60 s steady window plus
          # 30 s of warm-up allowance (PR #6 needed 13.8 s). CI-PERF-GATES.
          uvx --from locust==2.46.7 locust -f backend/tests/perf/locustfile_sprint02.py \
            --headless --host http://127.0.0.1:8000 -u 51 -r 51 -t 90s \
            --csv reports/perf/perf --only-summary || echo "locust rc=$?"
      - name: Verdict (gates) and baseline table
        run: |
          python3 scripts/ci/perf_verdict.py --stats reports/perf/perf_stats.csv \
            --state reports/perf/perf_state.json --rps 50 --json reports/perf/verdict.json \
            --history reports/perf/perf_stats_history.csv --users 51 \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baseline
          path: reports/perf/
          if-no-files-found: warn

  # ------------------------------------------------------------------ supply chain
  secrets-and-audit:
    name: Secret scan, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: gitleaks (NFR-056), pinned and checksum-verified
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # HEAD's history only (PR: the merge commit), not `git log --all` (CI run 37732742355)
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts="--full-history HEAD" .
      - name: pip-audit (NFR-062)
        working-directory: backend
        run: |
          pip install "uv==${UV_VERSION}" "pip-audit==2.10.1"
          # FORCE_COLOR=1 would put ANSI codes into the file (CI run 37277549983).
          uv export --color never --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt
          pip-audit --strict --requirement /tmp/req.txt --disable-pip
      - name: pnpm audit, critical (NFR-062)
        working-directory: web
        run: |
          corepack enable
          pnpm audit --prod --audit-level critical

  sbom-licences:
    name: SBOM (CycloneDX) and licence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the shipped graph only (no dev dependencies)
        run: |
          mkdir -p reports # sbom-action does not create the output directory
          pip install "uv==${UV_VERSION}"
          (cd backend && uv sync --locked --no-dev)
          corepack enable
          (cd web && pnpm install --frozen-lockfile --prod)
      - name: SBOM for the backend environment
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: backend/.venv
          format: cyclonedx-json
          output-file: reports/sbom-backend.cdx.json
          upload-artifact: false
      - name: SBOM for the web runtime dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: web/node_modules
          format: cyclonedx-json
          output-file: reports/sbom-web.cdx.json
          upload-artifact: false
      - name: Licence gate, no AGPL or non-commercial (NFR-062)
        run: |
          python3 scripts/ci/check_licences.py --allow infra/licence-exceptions.json \
            --sbom reports/sbom-backend.cdx.json --sbom reports/sbom-web.cdx.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: reports/sbom-*.cdx.json
          if-no-files-found: warn

  # ------------------------------------------------------------------ nightly flaky report
  flaky-report:
    name: Flaky-test report (NFR-074)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - name: Install ffprobe (probe stage and probe tests need the real binary)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - run: |
          $COMPOSE up -d --wait postgres objectstore mailpit tracing
          $COMPOSE run --rm objectstore-init
      - name: Run the backend suites three times
        working-directory: backend
        run: |
          set -a; . ../infra/env.example; set +a
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT}/${POSTGRES_DB}"
          export S3_ENDPOINT_URL="http://127.0.0.1:${S3_HOST_PORT}" APP_ENV=test
          export MAIL_SMTP_URL="smtp://127.0.0.1:${MAILPIT_SMTP_HOST_PORT}"
          export MAILPIT_API_URL="http://127.0.0.1:${MAILPIT_UI_HOST_PORT}"
          uv sync --locked
          for i in 1 2 3; do
            uv run --no-sync pytest -q -m "(unit or integration or scenario or regression) and not nightly and not red_until" \
              --ignore=tests/integration/test_it_00_10_worker_sandbox.py \
              --ignore=tests/integration/test_it_00_10_worker_sandbox_strict.py \
              --junitxml="../reports/run-$i.xml" || true
          done
      - run: python3 scripts/ci/flaky_report.py --out reports/flaky.md reports/run-*.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaky-report
          path: reports/flaky.md

  # ------------------------------------------------------------------ single required check
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - pr-policy
      - workflow-lint
      - python-lint
      - python-types
      - python-unit
      - drill-lint
      - integration
      - fixture-integrity
      - infra-tests
      - web-checks
      - e2e
      - perf-baseline
      - secrets-and-audit
      - sbom-licences
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All gates green (skipped is allowed only for pr-policy outside PRs)
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          bad = []
          for job, info in needs.items():
              result = info["result"]
              if result == "success":
                  continue
              if result == "skipped" and job == "pr-policy" and os.environ["EVENT"] != "pull_request":
                  continue
              bad.append(f"{job}: {result}")
          print("\n".join(bad) or "all gates green")
          sys.exit(1 if bad else 0)
          '
