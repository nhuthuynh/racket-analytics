[project]
name = "racket-analytics"
version = "0.0.1"
description = "racket-analytics backend: API and worker (one Python project, two entry points; ADR 0008)"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
# Runtime dependencies follow ADR 0008. The implementing lanes (BE, ML, SRE) own additions here;
# senior-qa-engineer owns the [dependency-groups].dev block and the [tool.pytest] block.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "uvicorn>=0.30",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
racket-manifest-check = "racket.dataset.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=7.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racket"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- pytest (ST-004)
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-bdd: .feature files live at the repository root (tests/features), sprint-00 §3.
bdd_features_base_dir = "../tests/features"
timeout = 120
markers = [
    "unit: one behaviour, no I/O, sleeps or network; milliseconds each (EP/ENG-17)",
    "integration: crosses a real boundary (Postgres, object store, queue, worker, filesystem); never SQLite (AQS/OPS-05)",
    "scenario: a pytest-bdd scenario generated from tests/features/*.feature",
    "regression: a mandatory regression suite from testing-strategy §5; never deleted",
    "nightly: runs in the nightly quality job (ST-024), e.g. the 100,000-sequence differential oracle (NFR-002b)",
    "slow: takes more than ~1 s; excluded from the edit-time hook run",
    "scoring: rules engine, match structure and their properties (Gherkin @scoring); sprint-01 §12 demo `pytest -m scoring`",
    "golden_replay: replays a stored fixture match and compares canonical bytes with its golden file (NFR-075, G02-07)",
    "golden_an: golden matches GS-AN-1 (ST-049): product stats equal the coach's hand count exactly (NFR-004, G03-08 a)",
    "analytics: starter stats, uncertainty and the metric dictionary (Gherkin @analytics; G03-08 b, d)",
    "conservation: FR-109 attribution conservation, incl. the >= 1,000-match property (Gherkin @conservation; G03-08 c)",
    "needs_verification: depends on a pickleball rule not yet verified by the domain coach (DOM G1); reported separately",
    "milestone(name=...): spec milestone tag from Gherkin, e.g. @M0",
    "story(id=...): story tag from Gherkin, e.g. @story-ST-008",
    "nfr(id=...): NFR tag from Gherkin, e.g. @nfr-051",
    "bdd_tag(name=...): any other Gherkin tag, kept for reporting",
    "red_until(story=...): written first by QA; expected to fail until the named story is implemented (ST-012). Never xfail.",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["racket"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- ruff (AQS/STACK-05)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "RUF001"]  # RUF001: "1920×1080" is UI text (sprint-00 §7); S608: generated table names

# ---------------------------------------------------------------- mypy (NFR-077)
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["racket"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Strict on the domain-heavy modules named in sprint-00 §3.1 ST-002, plus the dataset check.
[[tool.mypy.overrides]]
module = [
    "racket.scoring.*",
    "racket.analytics.*",
    "racket.coaching.*",
    "racket.sports.*",
    "racket.dataset.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["pytest_bdd.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
