# Budgets that are not round numbers (PE-073-01, SBE-ST073-R1-01): 2.4 / 3 and 266.4 / 333 are
# 0.7999999999999999 in IEEE 754, so a bare `>= 0.8` would miss them.
- name: 'BillingLlmProviderBudget80: budget 3, 79% (2.37) -> no alert'
  interval: 1m
  input_series:
  - series: racket_billing_monthly_budget_usd{provider="llm_provider"}
    values: 3x5
  - series: racket_billing_spend_month_to_date_usd{provider="llm_provider"}
    values: 2.37x5
  alert_rule_test:
  - eval_time: 1m
    alertname: BillingLlmProviderBudget80
    exp_alerts: []
- name: 'BillingLlmProviderBudget80: budget 3, 80% (2.4) -> fires'
