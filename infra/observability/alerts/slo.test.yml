- name: 'UploadCompletionSlowBurn: 3 % of uploads fail for 6h -> fires'
  interval: 1m
  input_series:
  - series: racket_upload_sessions_total{job="racket-api",event="created"}
    values: 0+1100x365
  - series: racket_upload_sessions_total{job="racket-api",event="rejected",reason="too_large"}
    values: 0+100x365
  - series: racket_upload_sessions_total{job="racket-api",event="completed"}
    values: 0+970x365
  - series: racket_upload_sessions_total{job="racket-api",event="expired"}
    values: 0+15x365
  - series: racket_upload_sessions_total{job="racket-purge",event="expired"}
