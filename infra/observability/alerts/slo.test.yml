        window: slow
      exp_annotations:
        summary: Upload completion is spending its 30-day error budget 1.5 times too fast (6 h and 30 m windows)
        runbook: docs/ops/slo.md
  promql_expr_test:
  - expr: slo:upload_error_ratio:rate30m
    eval_time: 6h
    exp_samples:
