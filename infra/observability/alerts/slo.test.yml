# promtool unit tests for slo.yml (ST-075c; NFR-041.1, .3, .4, NFR-042.1, .3, .4; ADR 0057 §2).
# Eight cases: each burn-rate alert fires on its NFR burn and does not fire on its negative burn
# (negative case first). A burn is 1000 valid events a minute, of which the given share fails.
# API series also carry 500 responses a minute with status 429 (in neither part of the ratio);
# upload series also carry created and rejected events (not terminal outcomes) and expirations
# from both emitters (racket-api, racket-purge). promql_expr_test pins the recorded error ratio
# to the share of failures in the series (NFR-041.1, NFR-042.1).
# Generated by infra/tests/slo_rule_fixtures.burn_case; test_slo_rules.py checks they agree.
# Run (image pinned in infra/tests/billing_alert_fixtures.py, PROMTOOL_IMAGE; docs/ops/slo.md):
#   promtool test rules slo.test.yml
rule_files:
- slo.yml
evaluation_interval: 30s
tests:
- name: 'ApiAvailabilityFastBurn: 0.1 % of API responses fail for 10m -> does not fire'
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="200"}
    values: 0+999x15
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="500"}
    values: 0+1x15
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="429"}
    values: 0+500x15
  alert_rule_test:
  - eval_time: 10m
    alertname: ApiAvailabilityFastBurn
    exp_alerts: []
  promql_expr_test:
  - expr: slo:api_error_ratio:rate5m
    eval_time: 10m
    exp_samples:
    - labels: slo:api_error_ratio:rate5m
      value: 0.001
- name: 'ApiAvailabilityFastBurn: 10 % of API responses fail for 10m -> fires'
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="200"}
    values: 0+900x15
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="500"}
    values: 0+100x15
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="429"}
    values: 0+500x15
  alert_rule_test:
  - eval_time: 10m
    alertname: ApiAvailabilityFastBurn
    exp_alerts:
    - exp_labels:
        severity: page
        slo: api_availability
        window: fast
      exp_annotations:
        summary: API availability is spending its 30-day error budget 14.4 times too fast (1 h and 5 m windows)
        runbook: docs/ops/slo.md
  promql_expr_test:
  - expr: slo:api_error_ratio:rate5m
    eval_time: 10m
    exp_samples:
    - labels: slo:api_error_ratio:rate5m
      value: 0.1
- name: 'ApiAvailabilitySlowBurn: 0.3 % of API responses fail for 6h -> does not fire'
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="200"}
    values: 0+997x365
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="500"}
    values: 0+3x365
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="429"}
    values: 0+500x365
  alert_rule_test:
  - eval_time: 6h
    alertname: ApiAvailabilitySlowBurn
    exp_alerts: []
  promql_expr_test:
  - expr: slo:api_error_ratio:rate30m
    eval_time: 6h
    exp_samples:
    - labels: slo:api_error_ratio:rate30m
      value: 0.003
- name: 'ApiAvailabilitySlowBurn: 1 % of API responses fail for 6h -> fires'
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="200"}
    values: 0+990x365
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="500"}
    values: 0+10x365
  - series: http_server_request_duration_seconds_count{job="racket-api",http_request_method="GET",http_response_status_code="429"}
    values: 0+500x365
  alert_rule_test:
  - eval_time: 6h
    alertname: ApiAvailabilitySlowBurn
    exp_alerts:
    - exp_labels:
        severity: ticket
        slo: api_availability
        window: slow
      exp_annotations:
        summary: API availability is spending its 30-day error budget 1.5 times too fast (6 h and 30 m windows)
        runbook: docs/ops/slo.md
  promql_expr_test:
  - expr: slo:api_error_ratio:rate30m
    eval_time: 6h
    exp_samples:
    - labels: slo:api_error_ratio:rate30m
      value: 0.01
- name: 'UploadCompletionFastBurn: 0.5 % of uploads fail for 10m -> does not fire'
  interval: 1m
  input_series:
  - series: racket_upload_sessions_total{job="racket-api",event="created"}
    values: 0+1100x15
  - series: racket_upload_sessions_total{job="racket-api",event="rejected",reason="too_large"}
    values: 0+100x15
  - series: racket_upload_sessions_total{job="racket-api",event="completed"}
    values: 0+995x15
  - series: racket_upload_sessions_total{job="racket-api",event="expired"}
    values: 0+3x15
  - series: racket_upload_sessions_total{job="racket-purge",event="expired"}
    values: 0+2x15
  alert_rule_test:
  - eval_time: 10m
    alertname: UploadCompletionFastBurn
    exp_alerts: []
  promql_expr_test:
  - expr: slo:upload_error_ratio:rate5m
    eval_time: 10m
    exp_samples:
    - labels: slo:upload_error_ratio:rate5m
      value: 0.005
- name: 'UploadCompletionFastBurn: 20 % of uploads fail for 10m -> fires'
  interval: 1m
  input_series:
  - series: racket_upload_sessions_total{job="racket-api",event="created"}
    values: 0+1100x15
  - series: racket_upload_sessions_total{job="racket-api",event="rejected",reason="too_large"}
    values: 0+100x15
  - series: racket_upload_sessions_total{job="racket-api",event="completed"}
    values: 0+800x15
  - series: racket_upload_sessions_total{job="racket-api",event="expired"}
    values: 0+100x15
  - series: racket_upload_sessions_total{job="racket-purge",event="expired"}
    values: 0+100x15
  alert_rule_test:
  - eval_time: 10m
    alertname: UploadCompletionFastBurn
    exp_alerts:
    - exp_labels:
        severity: page
        slo: upload_completion
        window: fast
      exp_annotations:
        summary: Upload completion is spending its 30-day error budget 14.4 times too fast (1 h and 5 m windows)
        runbook: docs/ops/slo.md
  promql_expr_test:
  - expr: slo:upload_error_ratio:rate5m
    eval_time: 10m
    exp_samples:
    - labels: slo:upload_error_ratio:rate5m
      value: 0.2
- name: 'UploadCompletionSlowBurn: 0.5 % of uploads fail for 6h -> does not fire'
  interval: 1m
  input_series:
  - series: racket_upload_sessions_total{job="racket-api",event="created"}
    values: 0+1100x365
  - series: racket_upload_sessions_total{job="racket-api",event="rejected",reason="too_large"}
    values: 0+100x365
  - series: racket_upload_sessions_total{job="racket-api",event="completed"}
    values: 0+995x365
  - series: racket_upload_sessions_total{job="racket-api",event="expired"}
    values: 0+3x365
  - series: racket_upload_sessions_total{job="racket-purge",event="expired"}
    values: 0+2x365
  alert_rule_test:
  - eval_time: 6h
    alertname: UploadCompletionSlowBurn
    exp_alerts: []
  promql_expr_test:
  - expr: slo:upload_error_ratio:rate30m
    eval_time: 6h
    exp_samples:
    - labels: slo:upload_error_ratio:rate30m
