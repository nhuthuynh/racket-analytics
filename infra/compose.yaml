# racket-analytics dev stack (ST-001). One command:
#   cp infra/env.example infra/.env && docker compose -f infra/compose.yaml up -d --build --wait
# Same backing services as production: Postgres 16 (DB + job queue), an S3-compatible store
# (SeaweedFS, ADR 0008 part C), SMTP (Mailpit), OTLP tracing (Jaeger). Never SQLite [AQS/OPS-05].
# Every setting comes from the environment; required ones fail fast via ${VAR:?} [AQS/OPS-01].
name: racket-analytics

x-required-app-env: &app-env
  APP_ENV: ${APP_ENV:?set APP_ENV in infra/.env (see infra/env.example)}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEV_IDENTITY_ENABLED: ${DEV_IDENTITY_ENABLED:-false}
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  S3_ENDPOINT_URL: http://objectstore:8333
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?set S3_PUBLIC_ENDPOINT_URL}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?set S3_BUCKET_MEDIA}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tracing:4318
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}

# Sign-in by email link (ST-013, ADR 0025, ADR 0027; api-sprint-01 §8). The API builds the link
# from PUBLIC_WEB_ORIGIN; the mailer sends it through Mailpit. AUTH_EMAIL_KEY is the HMAC key for
# email pseudonyms: a dev placeholder in env.example, the secret store in staging/prod.
x-sign-in-env: &sign-in-env
  PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?set PUBLIC_WEB_ORIGIN (see infra/env.example)}
  MAIL_SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
  AUTH_EMAIL_KEY: ${AUTH_EMAIL_KEY:?set AUTH_EMAIL_KEY}

services:
  postgres:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [edge, sandbox]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

  objectstore:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/chrislusf/seaweedfs:3.97
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"racket","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -ip=objectstore -ip.bind=0.0.0.0 -volume.max=0 \
          -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - 127.0.0.1:${S3_HOST_PORT:-8333}:8333
    volumes:
      - s3data:/data
    networks: [edge, sandbox]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60
    stop_grace_period: 10s

  objectstore-init:
    # One-shot: create the media bucket (idempotent).
    image: ${DOCKERHUB_REGISTRY:-docker.io}/chrislusf/seaweedfs:3.97
    environment:
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?set S3_BUCKET_MEDIA}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name $$S3_BUCKET_MEDIA" | weed shell -master=objectstore:9333 2>&1 | grep -v -i "already exist" || true; echo "s3.bucket.list" | weed shell -master=objectstore:9333 | grep -q "$$S3_BUCKET_MEDIA"
    depends_on:
      objectstore:
        condition: service_healthy
    networks: [edge]
    restart: "no"

  mailpit:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025
      - 127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025
    networks: [edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  tracing:
    # Jaeger v2 (Apache-2.0): OTLP in on 4317/4318, UI on 16686 (sprint-00 §12 demo step 5).
    image: ${DOCKERHUB_REGISTRY:-docker.io}/jaegertracing/jaeger:2.10.0
    ports:
      - 127.0.0.1:${TRACING_UI_HOST_PORT:-16686}:16686
    networks: [edge, sandbox]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:16686/"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    # One-shot: apply the Alembic migrations (advisory-locked, idempotent) before api and
    # worker start, so the worker never polls a missing `jobs` table (QA-R1-02, R1-06).
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    command: ["python", "-m", "racket.platform.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    networks: [edge]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    environment:
      <<: [*app-env, *sign-in-env]
      OTEL_SERVICE_NAME: racket-api
      # The browser reaches the API through web-tls, which replaces any client X-Forwarded-For
      # with the real peer, and the web's /api rewrite, which forwards it unchanged (measured
      # 2026-10-05, ADR 0029). So the right-most entry is the client: per-IP sign-in limits key
      # on it, not on a proxy container (ST-013, T-ML-8).
      TRUSTED_PROXY_HOPS: "1"
      # Per-IP sign-in limits (api-sprint-01 §2.4). Contract defaults; the E2E stack raises them
      # because every Playwright test signs in from one host IP (smoke 2026-10-05).
      AUTH_LINK_LIMIT_PER_IP: ${AUTH_LINK_LIMIT_PER_IP:-20}
      AUTH_EXCHANGE_LIMIT_PER_IP: ${AUTH_EXCHANGE_LIMIT_PER_IP:-30}
      # tus Location prefix: the browser reaches the API through the web's /api rewrite, so
      # Location must be /api/uploads/{id} (R1-02, QA-R1-01; ADR 0011, ADR 0019).
      API_PUBLIC_PATH_PREFIX: ${API_PUBLIC_PATH_PREFIX:?set API_PUBLIC_PATH_PREFIX (see infra/env.example)}
    ports:
      - 127.0.0.1:${API_HOST_PORT:-8000}:8000
    networks: [edge]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
    stop_grace_period: 15s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: worker
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: racket-worker
      # Media stages only: this network has no route to Mailpit, so sign-in email jobs belong
      # to the mailer (ADR 0027).
      WORKER_STAGES: probe
    # Back after a crash; the loop itself survives database errors (R1-06).
    restart: unless-stopped
    # Sandbox (ST-009, NFR-054): only the internal network, so no route to the internet;
    # it reaches Postgres (queue), the object store and the tracing collector only.
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
          # Process-count cap (ST-009): RLIMIT_NPROC on ffprobe does not bind root; this does.
          # Per-process CPU/memory/wall-clock limits on ffprobe: racket.video_ingest.probe.
          pids: 256
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      # The worker writes a heartbeat file each poll loop (contract with ST-007).
      test: ["CMD-SHELL", "test -f /tmp/worker-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 30"]
      interval: 5s
      timeout: 3s
      retries: 12
    # SIGTERM returns the in-flight job to the queue within 10 s (NFR-046b).
    stop_signal: SIGTERM
    stop_grace_period: 12s

  mailer:
    # Job worker for the sign-in email (ST-013, ADR 0027): API image (no ffprobe), edge network
    # (reaches Mailpit), runs `send_sign_in_link` only. Media never reaches this process.
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    command: ["python", "-m", "racket.worker"]
    environment:
      <<: [*app-env, *sign-in-env]
      OTEL_SERVICE_NAME: racket-mailer
      WORKER_STAGES: send_sign_in_link
    restart: unless-stopped
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 30"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_signal: SIGTERM
    stop_grace_period: 12s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?set PUBLIC_API_BASE_URL}
      API_INTERNAL_URL: http://api:8000
    # No host port: browsers reach the web only through web-tls, over https (ADR 0029).
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  web-tls:
    # TLS front door (ADR 0029): https://localhost:3000 by default. Outside APP_ENV=test the
    # session cookie is `__Host-` + Secure, which WebKit drops over plain http. Caddy's internal
    # CA and leaf key are generated at first start into caddy-data; none is committed.
    image: ${DOCKERHUB_REGISTRY:-docker.io}/library/caddy:2.10.2-alpine
    ports:
      - 127.0.0.1:${WEB_HOST_PORT:-3000}:443
    volumes:
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    read_only: true
    tmpfs:
      - /config:size=8m
      - /tmp:size=8m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  edge: {}
  sandbox:
    internal: true

volumes:
  pgdata: {}
  s3data: {}
  caddy-data: {}
